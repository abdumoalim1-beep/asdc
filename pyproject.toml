[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asdc"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "openai>=1.30,<2",
    "python-docx>=1.1,<2",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "python-multipart>=0.0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
